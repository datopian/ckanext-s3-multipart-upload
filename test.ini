[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = paste@localhost

[server:main]
use = egg:Paste#http
host = 0.0.0.0
port = 5000

[app:main]
use = config:../../src/ckan/test-core.ini

ckan.plugins = s3filestore s3_multipart_upload

## ckanext-s3filestore settings (shared by ckanext-s3-multipart-upload)

ckanext.s3filestore.aws_access_key_id = testing
ckanext.s3filestore.aws_secret_access_key = testing
ckanext.s3filestore.aws_bucket_name = test-bucket
ckanext.s3filestore.region_name = us-east-1
ckanext.s3filestore.signature_version = s3v4
ckanext.s3filestore.acl = private
# No real bucket exists in tests until a per-test moto mock creates one, so
# skip the access check that would otherwise run at app startup.
ckanext.s3filestore.check_access_on_startup = false

# Logging configuration
[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[logger_sqlalchemy]
handlers =
qualname = sqlalchemy.engine
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
